name: Admin Portal CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'admin-client/**'
      - 'server/src/**'
  pull_request:
    branches: [develop, main]
    paths:
      - 'admin-client/**'
      - 'server/src/**'

jobs:
  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-client/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
